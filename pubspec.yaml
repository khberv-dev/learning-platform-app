name: student
description: "Mobile app for iTeach students"
publish_to: 'none'
version: 1.1.0+18

environment:
  sdk: ^3.11.4

dependencies:
  audioplayers: ^6.1.0
  chewie: ^1.8.5
  dio: ^5.9.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_pcm_sound: ^3.3.3
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  flutter_webrtc: ^1.6.0
  go_router: ^17.2.2
  intl: any
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5
  pdfrx: ^2.4.7
  pinput: ^6.0.2
  record: ^6.0.0
  shared_preferences: ^2.5.5
  socket_io_client: ^2.0.0
  talker_dio_logger: ^5.1.16
  upgrader: ^13.6.0
  url_launcher: ^6.3.2
  version: ^3.0.2
  video_player: ^2.9.2
  image_picker: ^1.2.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Regenerates lib/l10n/app_localizations*.dart from the .arb files on
  # `flutter pub get` and on every build. Configured by l10n.yaml.
  generate: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
  # SF Pro Rounded can't be bundled (Apple-exclusive font, license forbids
  # redistribution) — M PLUS Rounded 1c is the open-licence (OFL) stand-in
  # used app-wide instead, on both iOS and Android.
  fonts:
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c/MPLUSRounded1c-Thin.ttf
          weight: 100
        - asset: assets/fonts/MPLUSRounded1c/MPLUSRounded1c-Light.ttf
          weight: 300
        - asset: assets/fonts/MPLUSRounded1c/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/MPLUSRounded1c/MPLUSRounded1c-Black.ttf
          weight: 900

flutter_launcher_icons:
  image_path: assets/images/brand.png
  android: true
  ios: true
  remove_alpha_ios: true
